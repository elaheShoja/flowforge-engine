<svg
  width="1000"
  height="320"
  viewBox="0 0 1000 320"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- =====================================================
         Main F Gradient
    ====================================================== -->

    <linearGradient
      id="flowforge-gradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#67A8FF"
      />

      <stop
        offset="45%"
        stop-color="#4169FF"
      />

      <stop
        offset="100%"
        stop-color="#8B2CFF"
      />
    </linearGradient>


    <!-- =====================================================
         Secondary F Gradient
    ====================================================== -->

    <linearGradient
      id="flowforge-gradient-secondary"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#6A8DFF"
      />

      <stop
        offset="55%"
        stop-color="#4B5FFF"
      />

      <stop
        offset="100%"
        stop-color="#9B27FF"
      />
    </linearGradient>


    <!-- =====================================================
         Accent Line Gradient
    ====================================================== -->

    <linearGradient
      id="flowforge-line"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#4D8DFF"
      />

      <stop
        offset="50%"
        stop-color="#8A2BE2"
      />

      <stop
        offset="100%"
        stop-color="#D62EFF"
      />
    </linearGradient>

  </defs>


  <!-- =====================================================
       FLOWFORGE MARK
       Two Interlocking F Forms
  ====================================================== -->

  <g transform="translate(55 45)">

    <!-- =========================
         First F
    ========================== -->

    <path
      d="
        M 0 55
        L 55 0
        L 245 0
        L 185 60
        L 85 60
        L 30 115
        Z
      "
      fill="url(#flowforge-gradient)"
    />

    <path
      d="
        M 30 115
        L 85 60
        L 185 60
        L 125 120
        L 55 120
        Z
      "
      fill="url(#flowforge-gradient)"
      opacity="0.96"
    />


    <!-- =========================
         Second F
    ========================== -->

    <path
      d="
        M 30 135
        L 85 80
        L 205 80
        L 150 135
        L 95 135
        L 40 190
        Z
      "
      fill="url(#flowforge-gradient-secondary)"
    />

    <path
      d="
        M 40 190
        L 95 135
        L 150 135
        L 95 190
        L 40 245
        Z
      "
      fill="url(#flowforge-gradient-secondary)"
    />

  </g>


  <!-- =====================================================
       FLOWFORGE WORDMARK
  ====================================================== -->

  <text
    x="320"
    y="145"
    fill="#172033"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="700"
    letter-spacing="-2"
  >
    FlowForge
  </text>


  <!-- =====================================================
       ENGINE
  ====================================================== -->

  <text
    x="323"
    y="207"
    fill="#5B6475"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="43"
    font-weight="400"
    letter-spacing="1.5"
  >
    Engine
  </text>


  <!-- =====================================================
       ACCENT LINE
  ====================================================== -->

  <rect
    x="55"
    y="265"
    width="850"
    height="3"
    rx="1.5"
    fill="url(#flowforge-line)"
  />

</svg>