<svg
  width="320"
  height="320"
  viewBox="0 0 320 320"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- =====================================================
         Main F Gradient
    ====================================================== -->

    <linearGradient
      id="flowforge-gradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#67A8FF"
      />

      <stop
        offset="45%"
        stop-color="#4169FF"
      />

      <stop
        offset="100%"
        stop-color="#8B2CFF"
      />
    </linearGradient>


    <!-- =====================================================
         Secondary F Gradient
    ====================================================== -->

    <linearGradient
      id="flowforge-gradient-secondary"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#6A8DFF"
      />

      <stop
        offset="55%"
        stop-color="#4B5FFF"
      />

      <stop
        offset="100%"
        stop-color="#9B27FF"
      />
    </linearGradient>

  </defs>


  <!-- =====================================================
       FLOWFORGE MARK
       Two Interlocking F Forms
  ====================================================== -->

  <g transform="translate(35 35)">

    <!-- =========================
         First F
    ========================== -->

    <path
      d="
        M 0 55
        L 55 0
        L 245 0
        L 185 60
        L 85 60
        L 30 115
        Z
      "
      fill="url(#flowforge-gradient)"
    />

    <path
      d="
        M 30 115
        L 85 60
        L 185 60
        L 125 120
        L 55 120
        Z
      "
      fill="url(#flowforge-gradient)"
      opacity="0.96"
    />


    <!-- =========================
         Second F
    ========================== -->

    <path
      d="
        M 30 135
        L 85 80
        L 205 80
        L 150 135
        L 95 135
        L 40 190
        Z
      "
      fill="url(#flowforge-gradient-secondary)"
    />

    <path
      d="
        M 40 190
        L 95 135
        L 150 135
        L 95 190
        L 40 245
        Z
      "
      fill="url(#flowforge-gradient-secondary)"
    />

  </g>

</svg>